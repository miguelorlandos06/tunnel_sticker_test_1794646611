name: Tunnel Server (Node.js)
on: [workflow_dispatch]

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Arrancar servidor Node.js
        env:
          CHAN: ${{ secrets.TUNNEL_CHAN }}
          PSK:  ${{ secrets.TUNNEL_PSK }}
        run: |
          python3 - <<PYEOF
          import json, os
          json.dump({"todus_relay": {
            "s3_base": "https://s3.todus.cu", "bucket": "stickers",
            "chan": os.environ["CHAN"], "psk": os.environ["PSK"],
            "chunk_kb": 32, "poll_ms": 10, "workers": 32, "inflight": 64,
            "gc_hours": 24, "compress": True,
            "dial_timeout_s": 12, "idle_timeout_s": 600, "blocked_hosts": []
          }}, open("config.server.json","w"))
          PYEOF
          node server.js &
          PID=$!
          echo "✅ Servidor Node.js vivo PID=$PID — listo para conectar"
          for i in $(seq 1 55); do sleep 60; kill -0 $PID 2>/dev/null || { echo "❌ Murió en minuto $i"; exit 1; }; echo "Minuto $i: vivo"; done
          kill $PID
