name: Tunnel Server (Node.js Auto-Renew)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Detener ejecuciones anteriores
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh run list --workflow=tunnel-server.yml --status=in_progress --json databaseId -q ".[].databaseId" | xargs -r -n 1 gh run cancel -R ${{ github.repository }} || true

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Arrancar servidor Node.js
        env:
          CHAN: ${{ secrets.TUNNEL_CHAN }}
          PSK:  ${{ secrets.TUNNEL_PSK }}
        run: |
          python3 - <<PYEOF
          import json, os
          json.dump({"todus_relay": {
            "s3_base": "https://s3.todus.cu", "bucket": "stream",
            "chan": os.environ["CHAN"], "psk": os.environ["PSK"],
            "chunk_kb": 256, "poll_ms": 50, "workers": 8, "inflight": 64,
            "gc_hours": 24, "compress": True,
            "dial_timeout_s": 30, "idle_timeout_s": 600, "blocked_hosts": []
          }}, open("config.server.json","w"))
          PYEOF
          
          node server.js &
          SERVER_PID=$!
          echo "✅ Servidor Node.js vivo. Durmiendo 5h 30m..."
          sleep 19800
          kill $SERVER_PID

      - name: Relanzar automáticamente
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run tunnel-server.yml -R ${{ github.repository }}
